[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rheolab"
version = "0.1.0.dev0"
description = "Power-law analysis of rheological CSV data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "plotly>=6",
    "streamlit>=1.66,<2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
